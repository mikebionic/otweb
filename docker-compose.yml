services:
  mysql:
    image: mysql:8.4
    container_name: otapi_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: otapi_hub
      MYSQL_USER: otapi
      MYSQL_PASSWORD: otapi_pass
    ports:
      - "3360:3306"
    volumes:
      - otapi_mysql_data:/var/lib/mysql
      - ./db/migrations:/docker-entrypoint-initdb.d
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  adminer:
    image: adminer:4
    container_name: otapi_adminer
    restart: unless-stopped
    ports:
      - "8082:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    depends_on:
      - mysql

volumes:
  otapi_mysql_data:
