{{define "layout.html"}}<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} — OTAPI Hub</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <style>
    :root { --sidebar-width: 230px; }
    body { background: #f1f3f5; }
    .sidebar {
      width: var(--sidebar-width);
      min-height: 100vh;
      background: #1e2130;
      position: fixed;
      top: 0; left: 0;
      display: flex;
      flex-direction: column;
      z-index: 100;
    }
    .sidebar-brand {
      padding: 20px 18px 16px;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .sidebar-brand .sub { font-size: 10px; letter-spacing: .12em; color: rgba(255,255,255,.4); text-transform: uppercase; }
    .sidebar-brand .title { font-size: 18px; font-weight: 700; color: #fff; }
    .sidebar .nav-link {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 16px; margin: 2px 8px; border-radius: 7px;
      color: rgba(255,255,255,.6); font-size: 14px; font-weight: 500;
      transition: background .15s, color .15s;
    }
    .sidebar .nav-link:hover { background: rgba(255,255,255,.08); color: #fff; }
    .sidebar .nav-link.active { background: rgba(99,102,241,.25); color: #a5b4fc; }
    .sidebar .nav-link i { font-size: 16px; width: 20px; text-align: center; }
    .sidebar-footer {
      padding: 12px 16px;
      font-size: 11px; color: rgba(255,255,255,.3);
      border-top: 1px solid rgba(255,255,255,.07);
      margin-top: auto;
    }
    .main-wrap { margin-left: var(--sidebar-width); }
    .topbar {
      background: #fff;
      border-bottom: 1px solid #e9ecef;
      padding: 14px 24px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 50;
    }
    .topbar h1 { font-size: 16px; font-weight: 600; margin: 0; color: #212529; }
    .page-body { padding: 24px; }
    .stat-card { background: #fff; border-radius: 12px; padding: 20px 22px; border: 1px solid #e9ecef; }
    .stat-card .stat-label { font-size: 12px; color: #6c757d; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; }
    .stat-card .stat-value { font-size: 28px; font-weight: 700; color: #212529; line-height: 1; }
    .stat-card .stat-icon { font-size: 22px; }
    .card { border-radius: 12px; border: 1px solid #e9ecef; }
    .table th { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: #6c757d; font-weight: 600; border-top: none; }
    .table td { font-size: 13px; vertical-align: middle; }
    .product-card { background: #fff; border: 1px solid #e9ecef; border-radius: 10px; overflow: hidden; transition: box-shadow .15s; }
    .product-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.08); }
    .product-card .prod-img { width: 100%; height: 160px; object-fit: cover; background: #f8f9fa; display: block; }
    .product-card .prod-body { padding: 10px 12px; }
    .product-card .prod-title { font-size: 12px; color: #495057; line-height: 1.3; height: 34px; overflow: hidden; margin-bottom: 6px; }
    .product-card .prod-price { font-size: 13px; font-weight: 600; color: #212529; }
  </style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-brand">
    <div class="sub">Wabrum</div>
    <div class="title">OTAPI Hub</div>
  </div>
  <nav class="mt-2 flex-grow-1">
    <a href="{{.Prefix}}/" class="nav-link {{if eq .Page "dashboard"}}active{{end}}">
      <i class="bi bi-speedometer2"></i> Dashboard
    </a>
    <a href="{{.Prefix}}/categories" class="nav-link {{if eq .Page "categories"}}active{{end}}">
      <i class="bi bi-grid-3x3-gap"></i> Категории
    </a>
    <a href="{{.Prefix}}/products" class="nav-link {{if eq .Page "products"}}active{{end}}">
      <i class="bi bi-box-seam"></i> Товары
    </a>
    <a href="{{.Prefix}}/sync" class="nav-link {{if eq .Page "sync"}}active{{end}}">
      <i class="bi bi-arrow-repeat"></i> Синхронизация
    </a>
    <a href="{{.Prefix}}/push" class="nav-link {{if eq .Page "push"}}active{{end}}">
      <i class="bi bi-cloud-upload"></i> Push в Wabrum
    </a>
    <a href="{{.Prefix}}/mapping" class="nav-link {{if eq .Page "mapping"}}active{{end}}">
      <i class="bi bi-arrow-left-right"></i> Mapping
    </a>
    <div style="border-top:1px solid rgba(255,255,255,.07);margin:12px 8px;"></div>
    <a href="{{.Prefix}}/settings" class="nav-link {{if eq .Page "settings"}}active{{end}}">
      <i class="bi bi-gear"></i> Настройки
    </a>
  </nav>
  <div class="sidebar-footer">
    <a href="{{p "/logout"}}" class="text-decoration-none" style="color:rgba(255,255,255,.5);font-size:12px">
      <i class="bi bi-box-arrow-left me-1"></i> Выход
    </a>
  </div>
</aside>

<div class="main-wrap">
  <div class="topbar">
    <h1>{{.Title}}</h1>
    <span class="text-muted" style="font-size:12px"><i class="bi bi-database me-1"></i>MySQL · OTAPI Hub</span>
  </div>
  <div class="page-body">
    {{template "content" .}}
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
{{end}}
