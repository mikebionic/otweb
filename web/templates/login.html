{{define "login"}}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OTAPI Hub - Вход</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f0f2f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-card { max-width: 380px; width: 100%; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <h5 class="fw-bold">OTAPI Hub</h5>
          <small class="text-muted">OT Commerce -> CS-Cart Connector</small>
        </div>
        {{if .Error}}
        <div class="alert alert-danger py-2 small">{{.Error}}</div>
        {{end}}
        <form method="POST" action="/otweb/login">
          <div class="mb-3">
            <label class="form-label small">Логин</label>
            <input type="text" name="username" class="form-control" autofocus required>
          </div>
          <div class="mb-3">
            <label class="form-label small">Пароль</label>
            <input type="password" name="password" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Войти</button>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
{{end}}
